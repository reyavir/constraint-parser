<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Multi-hop test app</title></head>
<body>
  <button id="btn-0">Direct write (0 hops)</button>
  <span id="display-0">unset</span>

  <button id="btn-1">One hop</button>
  <span id="display-1">unset</span>

  <button id="btn-2">Two hops</button>
  <span id="display-2">unset</span>

  <button id="btn-3">Three hops</button>
  <span id="display-3">unset</span>

  <button id="btn-4">Four hops</button>
  <span id="display-4">unset</span>

  <button id="btn-broken">Broken (one branch skips write)</button>
  <span id="display-broken">unset</span>

  <button id="btn-ifelse">If/else both branches write</button>
  <span id="display-ifelse">unset</span>

  <button id="btn-ifelse-nested">If/else nested inside helper</button>
  <span id="display-ifelse-nested">unset</span>

  <button id="btn-classlist">classList.add</button>
  <span id="display-classlist">unset</span>

  <button id="btn-classlist-toggle">classList.toggle</button>
  <span id="display-classlist-toggle">unset</span>

  <button id="btn-style">style.setProperty</button>
  <span id="display-style">unset</span>

  <script src="app.js"></script>
</body></html>
