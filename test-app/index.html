<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Shop</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<header>
<h1 data-cv-label="Shop" id="cv_0001">Shop</h1>
<div data-cv-label="Cart: 0 items —
      Total: $" id="cart-summary">
      Cart: <span data-cv-label="0" id="cart-count">0</span> items —
      Total: $<span data-cv-label="0.00" id="cart-total">0.00</span>
</div>
</header>
<main>
<!-- Product card -->
<div class="product-card" data-cv-label="Mechanical Keyboard $120.00 Qt" id="product-1">
<h2 data-cv-label="Mechanical Keyboard" id="product-name">Mechanical Keyboard</h2>
<p data-cv-label="$120.00" id="product-price">$120.00</p>
<label data-cv-label="Qty" for="qty-input" id="cv_0002">Qty</label>
<div class="qty-row" data-cv-label="− +" id="cv_0005">
<button data-cv-label="Decrease quantity" id="qty-minus-btn" type="button">−</button>
<input id="qty-input" max="99" min="1" type="number" value="1"/>
<button data-cv-label="Increase quantity" id="qty-plus-btn" type="button">+</button>
</div>
<button data-cv-label="Add to Cart" id="add-to-cart-btn">Add to Cart</button>
<button data-cv-label="Favorite" id="favorite-btn" type="button">♡ Favorite</button>
</div>
<!-- Favorites panel -->
<div class="favorites-panel">
<h2 data-cv-label="Favorites" id="cv_0004">Favorites — <span data-cv-label="0" id="favorite-count">0</span></h2>
<div id="favorite-list"></div>
</div>
<!-- Cart panel -->
<div class="cart-panel">
<h2 data-cv-label="Your Cart" id="cv_0003">Your Cart</h2>
<div id="cart-list"></div>
<button data-cv-label="Checkout" id="checkout-btn">Checkout</button>
<div id="error-display"></div>
</div>
<!-- Delegating demo (for inter-procedural all_paths_write) -->
<div class="delegate-panel">
<button data-cv-label="Greet" id="greet-btn" type="button">Greet</button>
<span data-cv-label="(idle)" id="status-display">(idle)</span>
</div>
<!-- Row 2 fixture: typed value mirrors into a display unconditionally -->
<div class="mirror-panel">
<input id="mirror-input" placeholder="type — mirror updates instantly" type="text"/>
<span data-cv-label="(empty)" id="mirror-display">(empty)</span>
</div>
<!-- Row 5 fixture: greeting only appears when the name field reads a specific value -->
<div class="validate-panel">
<input id="name-input" placeholder='type "alice"' type="text"/>
<button data-cv-label="Submit" id="submit-btn" type="button">Submit</button>
<span data-cv-label="" id="greeting-display"></span>
</div>
<!-- Order total fixture: constant-literal write (reset) + multi-source sum (compute) -->
<div class="order-total-panel">
<div>Subtotal: $<span data-cv-label="120.00" id="order-subtotal">120.00</span></div>
<label>Tax: $<input id="tax-input" type="text" value="9.60"/></label>
<label>Tip: $<input id="tip-input" type="text" value="20.00"/></label>
<button data-cv-label="Compute" id="compute-btn" type="button">Compute total</button>
<button data-cv-label="Reset" id="reset-total-btn" type="button">Reset</button>
<div>Total: $<span data-cv-label="0.00" id="order-total">0.00</span></div>
</div>
<!-- Running-tally fixture: target reads itself + 2 other components -->
<div class="tally-panel">
<div>Running total: $<span data-cv-label="0.00" id="tally-display">0.00</span></div>
<label>Charge: $<input id="charge-input" type="text" value="15.00"/></label>
<label>Fee: $<input id="fee-input" type="text" value="2.50"/></label>
<button data-cv-label="Add charge" id="add-tally-btn" type="button">Add charge</button>
</div>
<!-- Search -->
<div class="search-panel">
<input id="search-input" placeholder="Search products…" type="text"/>
<button data-cv-label="Search" id="search-btn">Search</button>
<div id="search-results"></div>
</div>
</main>
<script src="cart.js"></script>
<script src="search.js"></script>
<script src="local.js"></script>
</body>
</html>
